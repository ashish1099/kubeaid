---
version: 2

changelog:
  use: github-native
  sort: asc
  format: "[{{ .SHA }}](https://github.com/obmondo/kubeaid/commit/{{ .SHA }}) {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  abbrev: 7
  filters:
    exclude:
      - init
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  # Group commits messages by given regex and title.
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Docs
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Major Version Upgrades'
      regexp: '^.*### Major Version Upgrades.*$'
      order: 3
    - title: 'Minor Version Upgrades'
      regexp: '^.*### Minor Version Upgrades.*$'
      order: 4
    - title: 'Patch Version Upgrades'
      regexp: '^.*### Patch Version Upgrades.*$'
      order: 5
    - title: Others
      order: 999

builds:
  - skip: true

release:
  github:
    owner: ashish1099
    name: kubeaid
  prerelease: auto
  make_latest: true
  name_template: "{{ .Tag }}"
  header: |
    ## Release {{ .Tag }}

    This release includes automated Helm chart updates. The KubeAid version follows semantic versioning based on the highest version change in any Helm chart:
    - **Major bump**: If any chart has a major version change
    - **Minor bump**: If any chart has a minor version change (and no major changes)
    - **Patch bump**: If only patch version changes are present
  footer: |
    **Full Changelog**: https://github.com/obmondo/kubeaid/compare/{{ .PreviousTag }}...{{ .Tag }}
